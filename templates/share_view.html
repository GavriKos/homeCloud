{% extends 'base.html' %}
{% block title %}{{ _('file_viewer') }} — HomeCloud{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
    body {
        background: #000;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    /* Remove default container margins for fullscreen */
    .container.mb-5 {
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
        height: calc(100vh - 76px); /* Account for navbar height */
        width: 100vw !important;
    }

    /* Adjust navbar for better contrast */
    .navbar {
        margin-bottom: 0 !important;
        z-index: 1050;
    }

    .media-viewer-fullscreen {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .media-content {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .media-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: pointer;
        display: block;
    }

    .media-controls {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 0 2rem;
        pointer-events: none;
        z-index: 10;
    }

    .media-arrow {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1.5rem;
        pointer-events: auto;
        user-select: none;
        backdrop-filter: blur(10px);
        border: none;
        outline: none;
    }

    .media-arrow:hover {
        background: rgba(0, 0, 0, 0.9);
        transform: scale(1.1);
    }

    .media-arrow:active {
        transform: scale(0.95);
    }

    @media (max-width: 768px) {
        body {
            overflow: hidden;
        }

        .container.mb-5 {
            position: relative !important;
        }

        .media-controls {
            padding: 0 1rem;
        }

        .media-arrow {
            width: 50px;
            height: 50px;
            font-size: 1.3rem;
        }
    }

    /* Mobile landscape orientation */
    @media (max-width: 768px) and (orientation: landscape) {
        .navbar {
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1060;
            background: rgba(13, 110, 253, 0.9) !important; /* Semi-transparent */
            backdrop-filter: blur(10px);
        }

        .container.mb-5 {
            height: 100vh !important;
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        .media-viewer-fullscreen {
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100vh !important;
            padding-top: 0; /* No padding - navbar overlays */
        }

        .media-content {
            height: 100vh; /* Full viewport height */
            width: 100vw;
        }

        .media-img {
            width: 100vw !important;
            height: 100vh !important;
        }

        .media-controls {
            z-index: 1050; /* Below navbar but above image */
        }

        .media-arrow {
            background: rgba(0, 0, 0, 0.8) !important;
            backdrop-filter: blur(5px);
        }
    }

    /* Mobile portrait orientation */
    @media (max-width: 768px) and (orientation: portrait) {
        .navbar {
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1060;
        }

        .container.mb-5 {
            height: 100vh !important;
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        .media-viewer-fullscreen {
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100vh !important;
            padding-top: 76px; /* Space for navbar */
        }

        .media-content {
            height: calc(100vh - 76px);
            width: 100vw;
        }
    }

    /* Very small screens - smaller arrow buttons */
    @media (max-width: 480px) {
        .media-controls {
            padding: 0 0.5rem;
        }

        .media-arrow {
            width: 40px;
            height: 40px;
            font-size: 1.1rem;
        }
    }

    /* Extra rule for very low height screens (landscape phones) */
    @media (max-height: 500px) and (orientation: landscape) {
        .navbar {
            position: fixed !important;
            background: rgba(13, 110, 253, 0.9) !important;
            backdrop-filter: blur(10px);
            z-index: 1060;
        }

        .media-viewer-fullscreen {
            position: fixed !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100vh !important;
            width: 100vw !important;
        }

        .media-content {
            height: 100vh !important;
            width: 100vw !important;
        }

        .media-img {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain !important;
        }
    }
</style>
{% endblock %}
{% block content %}
<div class="media-viewer-fullscreen">
    <div class="media-content">
        <a id="media-link" data-fancybox="gallery" href="image1.jpg">
            <img id="media" src="image1.jpg" alt="Media" class="media-img">
        </a>

        <div class="media-controls">
            <button class="media-arrow" id="prev" title="{{ _('previous') }}">
                <i class="bi bi-chevron-left"></i>
            </button>
            <button class="media-arrow" id="next" title="{{ _('next') }}">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<script>
// Update navbar content when page loads
document.addEventListener('DOMContentLoaded', function() {
    const navbarBrand = document.querySelector('.navbar-brand');
    if (navbarBrand) {
        navbarBrand.innerHTML = '<span id="folder-name">{{ folder_name }}</span>';
    }

    // Add counter to navbar
    const navbarContainer = document.querySelector('.navbar .container');
    if (navbarContainer) {
        const counterDiv = document.createElement('div');
        counterDiv.className = 'navbar-text text-light me-3';
        counterDiv.innerHTML = '<span id="media-counter">1 / 1</span>';
        navbarContainer.insertBefore(counterDiv, navbarContainer.querySelector('.ms-auto'));
    }


});
</script>
{% endblock %}

<!-- Universal message modal -->
<div class="modal fade" id="messageModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="messageModalTitle">{{ _('message') }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="messageModalBody">
                <!-- Message will be inserted here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _('close') }}</button>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalTitle">{{ _('confirm') }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="confirmModalBody">
                <!-- Confirmation message will be inserted here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{{ _('cancel') }}</button>
                <button type="button" class="btn btn-primary" id="confirmModalConfirm">{{ _('yes') }}</button>
            </div>
        </div>
    </div>
</div>

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js"></script>
<script>
    // Universal function to show messages in modal
    function showMessage(title, message, type = 'info') {
        document.getElementById('messageModalTitle').textContent = title;
        const body = document.getElementById('messageModalBody');

        let alertClass = 'alert-info';
        if (type === 'error') alertClass = 'alert-danger';
        else if (type === 'success') alertClass = 'alert-success';
        else if (type === 'warning') alertClass = 'alert-warning';

        body.innerHTML = `<div class="alert ${alertClass} mb-0">${message}</div>`;
        new bootstrap.Modal(document.getElementById('messageModal')).show();
    }

    // Universal function to show confirmation modal
    function showConfirm(title, message, onConfirm) {
        document.getElementById('confirmModalTitle').textContent = title;
        document.getElementById('confirmModalBody').innerHTML = `<p class="mb-0">${message}</p>`;

        const confirmBtn = document.getElementById('confirmModalConfirm');
        const modal = new bootstrap.Modal(document.getElementById('confirmModal'));

        // Remove any existing event listeners
        confirmBtn.replaceWith(confirmBtn.cloneNode(true));
        const newConfirmBtn = document.getElementById('confirmModalConfirm');

        // Add new event listener
        newConfirmBtn.addEventListener('click', function () {
            modal.hide();
            onConfirm();
        });

        modal.show();
    }
    let currentIndex = 0;
    let mediaList = null;
    let viewedObject = null;
    const paths = window.location.pathname.split("/").filter(path => path !== "");
    const md5 = paths[paths.length - 1];

    function updateCounter() {
        if (mediaList) {
            $("#media-counter").text((currentIndex + 1) + " / " + mediaList.length);
        }
    }

    function updateFilename() {
        if (mediaList && mediaList[currentIndex]) {
            const filename = mediaList[currentIndex].path.split('/').pop();
            $("#current-filename").text(filename);
        }
    }

    function loadAll() {
        $.ajax({
            url: '/share/all/' + md5,
            method: 'GET',
            success: function (data) {
                mediaList = JSON.parse(data)["mediaList"];
                currentIndex = 0;
                loadMedia(currentIndex);
                updateCounter();
                updateFilename();
            },
            error: function () {
                showMessage('{{ _("error") }}', '{{ _("media_load_error") }}', 'error');
            }
        });
    }

    function loadMedia(index) {
        console.log(mediaList);
        if (!mediaList || !mediaList[index]) return;
        updateCounter();
        updateFilename();
        let mimetype = mediaList[index]["mimetype"];
        if (mimetype == "image") {
            $('#media-link').removeAttr("data-type");
            $('#media-link').attr('data-fancybox', "gallery");
            $.ajax({
                url: '/share/' + md5 + '/' + mediaList[index]["md5"],
                method: 'GET',
                xhrFields: { responseType: 'blob' },
                success: function (data) {
                    const url = URL.createObjectURL(data);
                    $('#media').attr('src', url);
                    $('#media-link').attr('href', url);
                    fancyAdaptateImage();
                    if (viewedObject != null) {
                        URL.revokeObjectURL(viewedObject);
                    }
                    viewedObject = url;
                },
                error: function () {
                    showMessage('{{ _("error") }}', '{{ _("media_load_error") }}', 'error');
                }
            });
        } else
            if (mimetype == "video") {
                $('#media').attr('src', "/static/video_without_thumb.jpg");
                $('#media-link').attr('href', '/share/' + md5 + '/' + mediaList[index]["md5"]);
                $('#media-link').removeAttr("data-type");
                $('#media-link').attr('data-fancybox', "gallery");
                fancyAdaptateVideo();
            } else
                if (mimetype == "maptrack") {
                    $('#media').attr('src', "/static/map_without_thumb.jpg");
                    $('#media-link').attr('href', "/external-viewer/maptrack/" + md5 + '/' + mediaList[index]["md5"]);
                    $('#media-link').attr('data-type', "iframe");
                    $('#media-link').attr('data-fancybox', "iframe");
                    fancyAdaptateIFrameMap();
                }
                else {
                    // Clear any previous fancybox settings
                    $('#media-link').removeAttr("data-fancybox");
                    $('#media-link').removeAttr("data-type");
                    $('#media-link').removeAttr("href");

                    // Show unknown content message
                    $('#media').attr('src', 'data:image/svg+xml;base64,' + btoa(`
                <svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
                    <rect width="400" height="300" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
                    <text x="200" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6c757d">
                        {{ _("unknown_content") }}
                    </text>
                    <text x="200" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#adb5bd">
                        MIME: ${mediaList[index]["mimetype"] || "unknown"}
                    </text>
                </svg>
            `));

                    // Disable fancybox for unknown content
                    $('#media-link').off('click').on('click', function (e) {
                        e.preventDefault();
                        return false;
                    });
                }
    }

    $('#prev').click(function () {
        if (!mediaList) return;
        currentIndex = (currentIndex > 0) ? currentIndex - 1 : mediaList.length - 1;
        loadMedia(currentIndex);
    });

    $('#next').click(function () {
        if (!mediaList) return;
        currentIndex = (currentIndex < mediaList.length - 1) ? currentIndex + 1 : 0;
        loadMedia(currentIndex);
    });

    loadAll();

    function fancyAdaptateImage() {
        $("[data-fancybox]").fancybox({
            arrows: false,
            infobar: true,
            toolbar: true,
            loop: true,
            iframe: { css: {} },
            // closeClickOutside: true // Doesn't work, so custom handler below
            afterShow: function (instance, current) {
                // Remove previous handler if exists
                $(document).off('mousedown.fancybox-close');
                // Add new handler
                $('.fancybox-bg').on('mousedown.fancybox-close', function (e) {
                    // Check that click was on overlay, not on image
                    if ($(e.target).hasClass('fancybox-bg')) {
                        $.fancybox.close();
                    }
                });
            },
            afterClose: function () {
                $('.fancybox-bg').off('mousedown.fancybox-close');
            }
        });
    }
    function fancyAdaptateVideo() {
        $('[data-fancybox]').fancybox({
            type: 'iframe',
            iframe: { preload: false },
            backFocus: false,
            buttons: ["close"]
        });
    }
    function fancyAdaptateIFrameMap() {
        $('[data-fancybox]').fancybox({
            type: 'iframe',
            backFocus: false,
            buttons: ["close"],
            iframe: { css: { width: '80%', height: '80%' } }
        });
    }

    // Keyboard navigation
    $(document).keydown(function(e) {
        if (e.keyCode === 37) { // Left arrow
            e.preventDefault();
            $('#prev').click();
        } else if (e.keyCode === 39) { // Right arrow
            e.preventDefault();
            $('#next').click();
        }
    });
</script>
{% endblock %}
